services:
  postgres:
    image: postgres:latest
    container_name: recruitment_postgres
    environment:
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment_pwd
      POSTGRES_DB: recruitment_db
    ports:
      - "5432:5432"
    volumes:
      - recruitment_pgdata:/var/lib/postgresql
      
      
  minio:
    image: quay.io/minio/minio:latest
    container_name: recruitment_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - recruitment_minio_data:/data
        
        
volumes:
  recruitment_pgdata:
  recruitment_minio_data:
