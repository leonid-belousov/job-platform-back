services:
  postgres:
    image: postgres:latest
    container_name: recruitment_postgres
    environment:
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment_pwd
      POSTGRES_DB: recruitment_db
    ports:
      - "5432:5432"
    volumes:
      - recruitment_pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U recruitment -d recruitment_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
  
  
  minio:
    image: quay.io/minio/minio:latest
    container_name: recruitment_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - recruitment_minio_data:/data
    restart: always
    
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: recruitment_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"


volumes:
  recruitment_pgdata:
  recruitment_minio_data:
